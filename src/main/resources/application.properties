spring.application.name=jtaskboard

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jtaskboard}
spring.datasource.username=${DB_USER:jtaskboard}
spring.datasource.password=${DB_PASSWORD:jtaskboard}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.time-zone=UTC

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:local-dev-secret-change-me-please-32chars-min}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Origins allowed to call the API from a browser (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

